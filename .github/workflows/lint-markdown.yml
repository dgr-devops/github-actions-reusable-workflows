name: Lint Markdown (reusable)

# Ejecuta markdownlint-cli2 sobre los ficheros Markdown indicados.

on:
  workflow_call:
    inputs:
      globs:
        description: Patrones de ficheros, uno por línea. Prefijo # para excluir.
        type: string
        default: |
          **/*.md
          #node_modules
      config:
        description: Ruta a la configuración de markdownlint (vacío = autodescubrimiento).
        type: string
        default: ""
      runs-on:
        description: Runner a usar.
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

concurrency:
  group: reusable-lint-markdown-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        with:
          globs: ${{ inputs.globs }}
          config: ${{ inputs.config }}
