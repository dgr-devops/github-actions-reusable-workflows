name: Lint Markdown (reusable)

# Ejecuta markdownlint-cli2 sobre los ficheros Markdown indicados.

on:
  workflow_call:
    inputs:
      globs:
        description: Patrones de ficheros, uno por línea. Prefijo # para excluir.
        type: string
        default: |
          **/*.md
          #node_modules
      config:
        description: Ruta a la configuración de markdownlint (vacío = autodescubrimiento).
        type: string
        default: ""
      runs-on:
        description: Runner a usar.
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

concurrency:
  group: reusable-lint-markdown-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: ${{ inputs.globs }}
          config: ${{ inputs.config }}
