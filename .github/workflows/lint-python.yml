name: Lint Python (reusable)

# Ejecuta ruff (lint y, opcionalmente, comprobación de formato).

on:
  workflow_call:
    inputs:
      path:
        description: Ruta a analizar (relativa a la raíz del repo).
        type: string
        default: "."
      python-version:
        description: Versión de Python con la que instalar y ejecutar ruff.
        type: string
        default: "3.12"
      ruff-version:
        description: Versión de ruff a instalar (fijada para builds reproducibles).
        type: string
        default: "0.8.6"
      check-format:
        description: Si es true, también ejecuta `ruff format --check`.
        type: boolean
        default: true
      runs-on:
        description: Runner a usar.
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

concurrency:
  group: reusable-lint-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cachear ruff
        uses: actions/cache@v4
        with:
          path: .ruff_cache
          key: ruff-${{ inputs.ruff-version }}-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/ruff.toml', '**/.ruff.toml') }}
          restore-keys: |
            ruff-${{ inputs.ruff-version }}-${{ runner.os }}-

      - name: Instalar ruff
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: python -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"

      - name: ruff check
        env:
          LINT_PATH: ${{ inputs.path }}
        run: ruff check --output-format=github "$LINT_PATH"

      - name: ruff format --check
        if: ${{ inputs.check-format }}
        env:
          LINT_PATH: ${{ inputs.path }}
        run: ruff format --check --diff "$LINT_PATH"
